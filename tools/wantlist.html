<title>Mage's Want List</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one sticky search bar over a dense scannable list, phone-first for in-store use */
:root{--bg:#f6f4fa;--card:#ffffff;--fg:#221d2e;--mute:#6b6480;--line:#e2dcec;--accent:#6a3fb5;--hot:#b8326a;--disp:'Fraunces',Georgia,serif;--body:'Atkinson Hyperlegible',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17141f;--card:#211c2c;--fg:#ece8f4;--mute:#a49cb8;--line:#332c42;--accent:#b597ee;--hot:#f07aa8;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17141f;--card:#211c2c;--fg:#ece8f4;--mute:#a49cb8;--line:#332c42;--accent:#b597ee;--hot:#f07aa8;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
h1{font:600 1.7rem/1.1 var(--disp);margin:0 0 4px;text-wrap:balance}
.sub{color:var(--mute);margin:0 0 14px;max-width:60ch}
.bar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:8px;z-index:5;display:flex;gap:8px;align-items:center}
input{flex:1;min-width:0;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg)}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
.count{color:var(--mute);font-size:.85rem;white-space:nowrap;font-variant-numeric:tabular-nums}
ul{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
li{background:var(--card);padding:10px 12px;display:grid;grid-template-columns:3.2rem 1fr;gap:10px;align-items:start}
.n{font:600 1.25rem/1 var(--disp);color:var(--accent);text-align:right;font-variant-numeric:tabular-nums;padding-top:2px}
.n small{display:block;font:400 .65rem/1.2 var(--body);color:var(--mute);letter-spacing:.04em;text-transform:uppercase}
.s{font-weight:700;min-width:0;overflow-wrap:anywhere}
.v{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.v span{font-size:.8rem;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--mute);font-variant-numeric:tabular-nums}
.v span.h{border-color:var(--hot);color:var(--hot);font-weight:700}
.more{margin:12px auto 0;display:block;font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
.more:focus-visible{outline:2px solid var(--accent)}
</style>
<div class="wrap">
<h1>Want List</h1>
<p class="sub">Books your customers have wishlisted that are out of stock right now, from customers' website and app wishlists (updated __DATE__). The big number is how many customers want something from that series. Volumes in pink are wanted by 2 or more people.</p>
<div class="bar"><input id="q" type="search" placeholder="Search a series, e.g. Bleach" autocomplete="off"><span class="count" id="c"></span></div>
<ul id="l"></ul>
<button class="more" id="m" type="button">Show more</button>
</div>
<script>
const D=__DATA__;let lim=60;const q=document.getElementById('q'),L=document.getElementById('l'),C=document.getElementById('c'),M=document.getElementById('m');
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function draw(){const t=q.value.trim().toLowerCase();const f=t?D.filter(r=>r[0].toLowerCase().includes(t)):D;C.textContent=f.length+' series';
L.innerHTML=f.slice(0,lim).map(r=>'<li><div class="n">'+r[1]+'<small>'+(r[1]==1?'wants':'want')+'</small></div><div class="s">'+esc(r[0])+'<div class="v">'+r[2].map(v=>'<span'+(v[1]>1?' class="h"':'')+'>'+esc(v[0])+(v[1]>1?' ×'+v[1]:'')+'</span>').join('')+'</div></div></li>').join('');M.hidden=f.length<=lim;}
q.addEventListener('input',()=>{lim=60;draw()});M.addEventListener('click',()=>{lim+=120;draw()});draw();
</script>
