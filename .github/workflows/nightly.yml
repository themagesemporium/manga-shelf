name: App data refresh (every 2 hours)
on:
  schedule:
    - cron: '17 */2 * * *'   # every 2 hours, at :17 past (Megan upgraded her plan Nov 9, 2026)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: nightly
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh snapshot and Want List
        env:
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: node tools/nightly.mjs
      - name: Point the app at the new snapshot
        if: always()
        run: |
          if ! git diff --quiet config.json; then
            git config user.name "mage-nightly"
            git config user.email "mage-nightly@users.noreply.github.com"
            git add config.json
            git commit -m "Nightly: new store snapshot"
            git push
          fi
