name: Themes
on:
  workflow_dispatch:
    inputs:
      mode: { description: 'export or apply', default: 'export' }
permissions:
  contents: read
concurrency: themes
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Themes ${{ github.event.inputs.mode }}
        env:
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          MODE: ${{ github.event.inputs.mode }}
        run: node tools/themes.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: themes-out
          path: themes-out/
          retention-days: 7
