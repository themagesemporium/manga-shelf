name: Themes
on:
  workflow_dispatch:
    inputs:
      mode: { description: 'export or apply', default: 'export' }
permissions:
  contents: write
concurrency: themes
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Themes ${{ github.event.inputs.mode }}
        env:
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          MODE: ${{ github.event.inputs.mode }}
        run: node tools/themes.mjs
      - name: Save the list to the themes-work branch (artifacts can't be downloaded from Claude's sessions)
        if: always()
        run: |
          git config user.name "mage-nightly"; git config user.email "mage-nightly@users.noreply.github.com"
          git fetch origin themes-work || true
          cp -r themes-out /tmp/to
          git checkout -B themes-work
          git rm -rq --cached . ; rm -rf ./* ; cp /tmp/to/* . 2>/dev/null || true ; git add -A ; git commit -qm "themes ${{ github.event.inputs.mode }} output" || true ; git push -f origin themes-work || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: themes-out
          path: themes-out/
          retention-days: 7
